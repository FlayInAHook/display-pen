<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			body {
				margin: 0;
				padding: 12px 16px;
				background: #2d2d2d;
				color: #d8d8d8;
				font: 9pt "Segoe UI", sans-serif;
			}
			label {
				display: flex;
				align-items: center;
				gap: 12px;
			}
			label span {
				width: 92px;
				text-align: right;
				color: #969696;
			}
			select {
				flex: 1;
				height: 26px;
				background: #3d3d3d;
				color: #d8d8d8;
				border: none;
				border-radius: 3px;
				padding: 0 6px;
				font: inherit;
			}
		</style>
	</head>
	<body>
		<label><span id="label"></span><select id="choice"></select></label>
		<script>
			// One settings panel for the Tool, Colour and Size actions. The colours match src/palette.ts.
			const FIELDS = {
				"com.tim.display-pen.tool": {
					key: "tool",
					label: "Tool",
					initial: "pen",
					options: [
						["pen", "Pen"],
						["highlighter", "Highlighter"],
						["eraser", "Eraser"],
						["cursor", "Mouse (normal mode)"],
					],
				},
				"com.tim.display-pen.color": {
					key: "color",
					label: "Colour",
					initial: "0",
					options: [
						...["Red", "Orange", "Yellow", "Green", "Blue", "Purple", "Black", "White"].map((n, i) => [String(i), n]),
						["next", "Next colour (cycle)"],
					],
				},
				"com.tim.display-pen.size": {
					key: "size",
					label: "Size",
					initial: "1",
					options: [
						["0", "Thin"],
						["1", "Medium"],
						["2", "Thick"],
						["next", "Next size (cycle)"],
					],
				},
			};

			// Called by Stream Deck when the panel opens.
			function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
				const { action, payload } = JSON.parse(actionInfo);
				const field = FIELDS[action];
				if (!field) return;
				const settings = payload.settings ?? {};
				const select = document.getElementById("choice");
				document.getElementById("label").textContent = field.label;
				for (const [value, text] of field.options) select.add(new Option(text, value));
				select.value = String(settings[field.key] ?? field.initial);

				const ws = new WebSocket(`ws://127.0.0.1:${port}`);
				ws.onopen = () => ws.send(JSON.stringify({ event: registerEvent, uuid }));
				select.onchange = () => {
					settings[field.key] = select.value;
					ws.send(JSON.stringify({ event: "setSettings", context: uuid, payload: settings }));
				};
			}
		</script>
	</body>
</html>
